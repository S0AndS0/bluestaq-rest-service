# vim: filetype=nginx

map $http_origin $allow_origin {
	~^https?://(.*\.)?localhost(:\d+)?$ $http_origin;
	default "";
}

##
# TODO:
#
# - https://docs.nginx.com/nginx/admin-guide/security-controls/controlling-access-proxied-tcp/
server {
	server_name api.localhost;

	listen 8080;

	port_in_redirect off;

	add_header 'Access-Control-Allow-Credentials' 'true' always;
	add_header 'Access-Control-Allow-Origin' $allow_origin always;
	add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
	add_header Very Origin;

	proxy_intercept_errors off;

	client_max_body_size 20M;

	resolver 127.0.0.11 ipv6=off valid=10s;
	resolver_timeout 5s;

	location / {
		set $target 'http://ard-api:3000';
		proxy_pass $target;
		proxy_set_header Cookie $http_cookie;
	}

	location /stripe/webhook {
		include /etc/nginx/includes/stripe-ips-webhooks.conf;
		set $target 'http://api:3000';
		proxy_pass $target;
		proxy_set_header Cookie $http_cookie;
	}
}

server {
	server_name uploads.localhost;

	listen 8080;

	port_in_redirect off;

	add_header 'Access-Control-Allow-Origin' $allow_origin always;
	add_header Very Origin;

	proxy_intercept_errors off;

	# https://nginx.org/en/docs/http/ngx_http_mp4_module.html
	# https://docs.nginx.com/nginx/admin-guide/web-server/serving-static-content/
	location / {
		autoindex off;
		mp4;
		mp4_buffer_size 1m;
		mp4_max_buffer_size 5m;
		## Note: following two options are only available via subscription
		##       https://www.f5.com/products/nginx
		# mp4_limit_rate on;
		# mp4_limit_rate_after 30s;
		root /srv/uploads;
		try_files $uri /srv/uploads/never-let-you-down.mp4 =404;
	}
}

